<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinChart — Financial Charting Library</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #050810;
        --bg2: #080d1a;
        --bg3: #0d1526;
        --border: #1a2540;
        --border2: #243050;
        --text: #c8d4e8;
        --text-dim: #4a5a7a;
        --text-bright: #e8f0ff;
        --accent: #3d7aff;
        --accent2: #00d9a3;
        --bull: #00c87a;
        --bear: #ff4060;
        --bull-dim: rgba(0, 200, 122, 0.18);
        --bear-dim: rgba(255, 64, 96, 0.18);
        --gold: #ffb830;
        --purple: #a855f7;
        --mono: "IBM Plex Mono", monospace;
        --sans: "IBM Plex Sans", sans-serif;
      }

      html,
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        height: 100%;
        overflow: hidden;
        user-select: none;
      }

      /* ── TOP BAR ── */
      #topbar {
        height: 44px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 24px;
        flex-shrink: 0;
      }
      .logo {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-transform: uppercase;
      }
      .logo span {
        color: var(--text-dim);
      }

      .price-display {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      #price-main {
        font-size: 18px;
        font-weight: 500;
        color: var(--text-bright);
        letter-spacing: -0.01em;
      }
      #price-change {
        font-size: 11px;
        font-weight: 400;
      }
      .up {
        color: var(--bull);
      }
      .down {
        color: var(--bear);
      }

      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .btn {
        height: 28px;
        padding: 0 10px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.15s;
        text-transform: uppercase;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(61, 122, 255, 0.08);
      }

      /* ── SYMBOL / TIMEFRAME BAR ── */
      #symbar {
        height: 36px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 0;
        flex-shrink: 0;
      }
      .sym-tab {
        height: 36px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        font-size: 11px;
        cursor: pointer;
        color: var(--text-dim);
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
      }
      .sym-tab:hover {
        color: var(--text);
      }
      .sym-tab.active {
        color: var(--text-bright);
        border-bottom-color: var(--accent);
      }

      .sep {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 8px;
      }

      /* ── LAYOUT ── */
      #layout {
        display: flex;
        height: calc(100vh - 80px);
        overflow: hidden;
      }

      /* ── SIDEBAR ── */
      #sidebar {
        width: 52px;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 0;
        gap: 2px;
        flex-shrink: 0;
      }
      .tool {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-dim);
        font-size: 14px;
        transition: all 0.15s;
      }
      .tool:hover {
        background: var(--bg3);
        color: var(--text);
      }
      .tool.active {
        background: rgba(61, 122, 255, 0.12);
        color: var(--accent);
      }

      /* ── CHART AREA ── */
      #chart-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* ── PANES ── */
      .pane {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
      }
      #pane-main {
        flex: 1;
      }
      #pane-vol {
        height: 70px;
        border-top: 1px solid var(--border);
      }
      #pane-rsi {
        height: 90px;
        border-top: 1px solid var(--border);
        display: none;
      }

      .pane-label {
        position: absolute;
        top: 6px;
        left: 10px;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        text-transform: uppercase;
        pointer-events: none;
        z-index: 2;
      }

      canvas.chart-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      canvas.overlay-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        pointer-events: none;
      }

      /* ── TIME AXIS ── */
      #time-axis {
        height: 24px;
        background: var(--bg2);
        border-top: 1px solid var(--border);
        position: relative;
        flex-shrink: 0;
      }
      #time-axis canvas {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* ── LEGEND ── */
      #legend {
        position: absolute;
        top: 6px;
        left: 62px;
        display: flex;
        gap: 14px;
        z-index: 10;
        pointer-events: none;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--text-dim);
      }
      .legend-dot {
        width: 8px;
        height: 2px;
        border-radius: 1px;
      }
      #ohlc-display {
        position: absolute;
        top: 6px;
        left: 62px;
        font-size: 10px;
        color: var(--text-dim);
        pointer-events: none;
        z-index: 10;
        display: flex;
        gap: 12px;
      }
      .ohlc-item {
        display: flex;
        gap: 4px;
      }
      .ohlc-label {
        color: var(--text-dim);
      }
      .ohlc-val {
        color: var(--text);
      }

      /* ── SCROLL INDICATOR ── */
      #scrollbar {
        height: 4px;
        background: var(--bg3);
        flex-shrink: 0;
        position: relative;
        cursor: pointer;
      }
      #scrollthumb {
        position: absolute;
        height: 4px;
        background: var(--border2);
        border-radius: 2px;
        transition: background 0.15s;
        cursor: grab;
      }
      #scrollthumb:hover {
        background: var(--accent);
      }

      /* ── STATUS ── */
      #statusbar {
        height: 20px;
        background: var(--bg2);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 9px;
        color: var(--text-dim);
        gap: 16px;
        flex-shrink: 0;
      }
      #status-fps {
        color: var(--accent2);
      }
      #status-bars {
      }
      #status-zoom {
      }
      #status-cursor {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <!-- TOP BAR -->
    <div id="topbar">
      <div class="logo">Fin<span>Chart</span></div>
      <div class="price-display">
        <span id="price-main">—</span>
        <span id="price-change">—</span>
      </div>
      <div class="toolbar">
        <button
          class="btn active"
          id="btn-candle"
          onclick="setChartType('candlestick')"
        >
          Candle
        </button>
        <button class="btn" id="btn-line" onclick="setChartType('line')">
          Line
        </button>
        <button class="btn" id="btn-area" onclick="setChartType('area')">
          Area
        </button>
        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        <button class="btn" id="btn-ma" onclick="toggleSeries('ma')">MA</button>
        <button class="btn" id="btn-bb" onclick="toggleSeries('bb')">BB</button>
        <button class="btn" id="btn-rsi" onclick="togglePane('rsi')">
          RSI
        </button>
        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        <button class="btn" onclick="resetZoom()">Reset</button>
        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        <button class="btn" id="btn-live" onclick="toggleLive()">⬤ Live</button>
      </div>
    </div>

    <!-- SYMBOL / TF BAR -->
    <div id="symbar">
      <div
        class="sym-tab active"
        style="font-weight: 500; color: var(--text-bright); font-size: 12px"
      >
        AAPL
      </div>
      <div class="sep"></div>
      <div class="sym-tab active" onclick="setTF(this, '1D')">1D</div>
      <div class="sym-tab" onclick="setTF(this, '1W')">1W</div>
      <div class="sym-tab" onclick="setTF(this, '1M')">1M</div>
    </div>

    <!-- LAYOUT -->
    <div id="layout">
      <!-- SIDEBAR TOOLS -->
      <div id="sidebar">
        <div
          class="tool active"
          title="Cursor"
          onclick="setTool(this, 'cursor')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M3 2L13 8.5L8 9.5L6 14L3 2Z"
              stroke="currentColor"
              stroke-width="1.2"
              fill="none"
            />
          </svg>
        </div>
        <div
          class="tool"
          title="Crosshair"
          onclick="setTool(this, 'crosshair')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="8"
              y1="1"
              x2="8"
              y2="15"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <line
              x1="1"
              y1="8"
              x2="15"
              y2="8"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <circle
              cx="8"
              cy="8"
              r="2"
              stroke="currentColor"
              stroke-width="1.1"
            />
          </svg>
        </div>
        <div
          class="tool"
          title="Trend Line"
          onclick="setTool(this, 'trendline')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="2"
              y1="13"
              x2="14"
              y2="3"
              stroke="currentColor"
              stroke-width="1.3"
            />
            <circle cx="2" cy="13" r="1.5" fill="currentColor" />
            <circle cx="14" cy="3" r="1.5" fill="currentColor" />
          </svg>
        </div>
        <div
          class="tool"
          title="Horizontal Line"
          onclick="setTool(this, 'hline')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="1"
              y1="8"
              x2="15"
              y2="8"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-dasharray="2 2"
            />
          </svg>
        </div>
        <div class="tool" title="Rectangle" onclick="setTool(this, 'rect')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="2.5"
              y="4.5"
              width="11"
              height="7"
              stroke="currentColor"
              stroke-width="1.2"
            />
          </svg>
        </div>
        <div
          class="sep"
          style="
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
          "
        ></div>
        <div class="tool" title="Fibonacci" onclick="setTool(this, 'fib')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <text
              x="3"
              y="12"
              fill="currentColor"
              font-size="9"
              font-family="monospace"
            >
              Fib
            </text>
          </svg>
        </div>
        <div class="tool" title="Text" onclick="setTool(this, 'text')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <text
              x="3"
              y="12"
              fill="currentColor"
              font-size="11"
              font-family="monospace"
              font-weight="600"
            >
              T
            </text>
          </svg>
        </div>
      </div>

      <!-- CHART AREA -->
      <div id="chart-area">
        <!-- OHLC DISPLAY -->
        <div id="ohlc-display"></div>

        <!-- MAIN PANE -->
        <div class="pane" id="pane-main">
          <canvas class="chart-canvas" id="canvas-main"></canvas>
          <canvas class="overlay-canvas" id="overlay-main"></canvas>
        </div>

        <!-- VOLUME PANE -->
        <div class="pane" id="pane-vol">
          <div class="pane-label">VOL</div>
          <canvas class="chart-canvas" id="canvas-vol"></canvas>
          <canvas class="overlay-canvas" id="overlay-vol"></canvas>
        </div>

        <!-- RSI PANE -->
        <div class="pane" id="pane-rsi">
          <div class="pane-label">RSI (14)</div>
          <canvas class="chart-canvas" id="canvas-rsi"></canvas>
          <canvas class="overlay-canvas" id="overlay-rsi"></canvas>
        </div>

        <!-- TIME AXIS -->
        <div id="time-axis">
          <canvas id="canvas-time"></canvas>
        </div>

        <!-- SCROLLBAR -->
        <div id="scrollbar">
          <div id="scrollthumb"></div>
        </div>

        <!-- STATUSBAR -->
        <div id="statusbar">
          <span id="status-fps">60 FPS</span>
          <span id="status-bars"></span>
          <span id="status-zoom"></span>
          <span id="status-cursor"></span>
        </div>
      </div>
    </div>

    <!-- LEGEND -->
    <div id="legend">
      <div class="legend-item" id="leg-ma" style="display: none">
        <div class="legend-dot" style="background: var(--gold)"></div>
        <span>MA 20</span>
      </div>
      <div class="legend-item" id="leg-bb" style="display: none">
        <div class="legend-dot" style="background: var(--purple)"></div>
        <span>BB 20</span>
      </div>
    </div>
    <script  src="chart.js"></script>
  </body>
</html>
