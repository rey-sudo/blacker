<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinChart — Financial Charting Library</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- TOP BAR -->
    <div id="topbar">
      <div class="toolbar">
        <button
          class="btn active"
          id="btn-candle"
          onclick="setChartType('candlestick')"
        >
          Candle
        </button>
        <button class="btn" id="btn-line" onclick="setChartType('line')">
          Line
        </button>
        <button class="btn" id="btn-area" onclick="setChartType('area')">
          Area
        </button>
        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        
        <button class="btn" id="btn-ma" onclick="toggleSeries('ma')">MA</button>
        <button class="btn" id="btn-bb" onclick="toggleSeries('bb')">BB</button>

        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        <button class="btn" onclick="resetZoom()">Reset</button>
        <div style="width: 1px; background: var(--border); margin: 0 4px"></div>
        <button class="btn" id="btn-live" onclick="toggleLive()">⬤ Live</button>
      </div>
    </div>

    <!-- LAYOUT -->
    <div id="layout">
      <!-- SIDEBAR TOOLS -->
      <div id="sidebar">
        <div
          class="tool active"
          title="Cursor"
          onclick="setTool(this, 'cursor')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M3 2L13 8.5L8 9.5L6 14L3 2Z"
              stroke="currentColor"
              stroke-width="1.2"
              fill="none"
            />
          </svg>
        </div>
        <div
          class="tool"
          title="Crosshair"
          onclick="setTool(this, 'crosshair')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="8"
              y1="1"
              x2="8"
              y2="15"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <line
              x1="1"
              y1="8"
              x2="15"
              y2="8"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <circle
              cx="8"
              cy="8"
              r="2"
              stroke="currentColor"
              stroke-width="1.1"
            />
          </svg>
        </div>
        <div
          class="tool"
          title="Trend Line"
          onclick="setTool(this, 'trendline')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="2"
              y1="13"
              x2="14"
              y2="3"
              stroke="currentColor"
              stroke-width="1.3"
            />
            <circle cx="2" cy="13" r="1.5" fill="currentColor" />
            <circle cx="14" cy="3" r="1.5" fill="currentColor" />
          </svg>
        </div>
        <div
          class="tool"
          title="Horizontal Line"
          onclick="setTool(this, 'hline')"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line
              x1="1"
              y1="8"
              x2="15"
              y2="8"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-dasharray="2 2"
            />
          </svg>
        </div>
        <div class="tool" title="Rectangle" onclick="setTool(this, 'rect')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="2.5"
              y="4.5"
              width="11"
              height="7"
              stroke="currentColor"
              stroke-width="1.2"
            />
          </svg>
        </div>
        <div
          class="sep"
          style="
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
          "
        ></div>
        <div class="tool" title="Fibonacci" onclick="setTool(this, 'fib')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <text
              x="3"
              y="12"
              fill="currentColor"
              font-size="9"
              font-family="monospace"
            >
              Fib
            </text>
          </svg>
        </div>
        <div class="tool" title="Text" onclick="setTool(this, 'text')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <text
              x="3"
              y="12"
              fill="currentColor"
              font-size="11"
              font-family="monospace"
              font-weight="600"
            >
              T
            </text>
          </svg>
        </div>
      </div>

      <!-- CHART AREA -->
      <div id="chart-area">
        <!-- OHLC DISPLAY -->
        <div id="ohlc-display"></div>

        <!-- MAIN PANE -->
        <div class="pane" id="pane-main">
          <canvas class="chart-canvas" id="canvas-main"></canvas>
          <canvas class="overlay-canvas" id="overlay-main"></canvas>
        </div>

        <!-- TIME AXIS -->
        <div id="time-axis">
          <canvas id="canvas-time"></canvas>
        </div>

        <!-- SCROLLBAR -->
        <div id="scrollbar">
          <div id="scrollthumb"></div>
        </div>

        <!-- STATUSBAR -->
        <div id="statusbar">
          <span id="status-fps">60 FPS</span>
          <span id="status-bars"></span>
          <span id="status-zoom"></span>
          <span id="status-cursor"></span>
        </div>
      </div>

      <!-- CHART AREA END -->
    </div>

    <!-- LEGEND -->
    <div id="legend">
      <div class="legend-item" id="leg-ma" style="display: none">
        <div class="legend-dot" style="background: var(--gold)"></div>
        <span>MA 20</span>
      </div>
      <div class="legend-item" id="leg-bb" style="display: none">
        <div class="legend-dot" style="background: var(--purple)"></div>
        <span>BB 20</span>
      </div>
    </div>
    <script src="chart.js"></script>
  </body>
</html>
