<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lightweight Charts v4+ (ESM working)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f1115;
        font-family: system-ui, sans-serif;
      }

      .app {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }

      .chart-container {
        width: 100%;
        max-width: 1300px;
        height: 700px;
        background: #131722;
        border-radius: 12px;
        padding: 16px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      #chart {
        width: 100%;
        height: 100%;
      }

      .controls {
        margin-top: 12px;
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .controls button {
        background: #1f2430;
        border: 1px solid #2a2e39;
        color: #d1d4dc;
        font-size: 18px;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .controls button:hover {
        background: #2a2e39;
      }

      .controls button:active {
        transform: scale(0.95);
      }

      .speed-control {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 16px;
      }

      #speedLabel {
        min-width: 60px;
        font-size: 12px;
        font-family: monospace;
        color: #9aa0a6;
        text-align: right;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chart-container">
        <div id="chart"></div>
      </div>

      <div class="controls">
        <button id="stepBack" title="Step back">⏮</button>
        <button id="playPause" title="Play / Pause">▶️</button>
        <button id="stepForward" title="Step forward">⏭</button>

        <div class="speed-control">
          <input
            id="speedRange"
            type="range"
            min="1"
            max="1000"
            step="50"
            value="400"
          />
        </div>
        <span id="speedLabel">400 ms</span>
      </div>
    </div>
    <script>
      function generateFakeOHLCV(
        length,
        {
          startPrice = 100,
          startDate = "2024-01-01",
          volatility = 0.02, // 2% por vela
          volumeBase = 1200,
        } = {},
      ) {
        const data = [];
        let lastClose = startPrice;
        let currentDate = new Date(startDate);

        for (let i = 0; i < length; i++) {
          const direction = Math.random() > 0.5 ? 1 : -1;
          const changePercent = Math.random() * volatility * direction;
          const close = lastClose * (1 + changePercent);

          const open = lastClose;
          const high =
            Math.max(open, close) * (1 + Math.random() * volatility * 0.5);
          const low =
            Math.min(open, close) * (1 - Math.random() * volatility * 0.5);

          const volume =
            volumeBase +
            Math.floor(Math.random() * volumeBase * 0.6) +
            (Math.random() > 0.9 ? volumeBase * 2 : 0);

          data.push({
            time: currentDate.toISOString().slice(0, 10), // YYYY-MM-DD
            open: +open.toFixed(2),
            high: +high.toFixed(2),
            low: +low.toFixed(2),
            close: +close.toFixed(2),
            volume: Math.floor(volume),
          });

          lastClose = close;
          currentDate.setDate(currentDate.getDate() + 1);
        }

        return data;
      }
    </script>
    <script type="module">
      import {
        createChart,
        CandlestickSeries,
        HistogramSeries,
      } from "https://esm.sh/lightweight-charts";

      const data = generateFakeOHLCV(1000);

      const container = document.getElementById("chart");

      const chart = createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: "#0f1115" },
          textColor: "#d1d4dc",
        },
        grid: {
          vertLines: {
            color: "#1f2430",
            style: 1,
            visible: true,
          },
          horzLines: {
            color: "#1f2430",
            style: 1,
            visible: true,
          },
        },
        timeScale: {
          barSpacing: 6,
          timeVisible: true,
          minBarSpacing: 2,
          rightOffset: 20,
        },
      });

      const candles = chart.addSeries(CandlestickSeries, {
        priceScaleId: "right",
      });

      candles.setData(
        data.map((d) => ({
          time: d.time,
          open: d.open,
          high: d.high,
          low: d.low,
          close: d.close,
        })),
      );

      chart.timeScale().fitContent();

      chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
        if (!range) return;

        //console.log(range);

        if (range.from < 10) {
          //loadMoreHistory();
        }
      });

      /* =========================
     REPLAY STATE
     ========================= */
      let currentIndex = 0;
      let isPlaying = false;
      let playInterval = null;

      let isSteppingBack = false;
      let isSteppingForward = false;

      let forwardInterval = null;
      let backInterval = null;

      let iterationSpeed = 400; // ms

      candles.setData([]);

      function render() {
        candles.setData(data.slice(0, currentIndex));
        chart.timeScale().fitContent();
      }

      /* =========================
     CONTROLS LOGIC
     ========================= */
      function stepForward() {
        if (currentIndex >= data.length) return;
        currentIndex++;
        render();
      }

      function stepBack() {
        if (currentIndex <= 0) return;
        currentIndex--;
        render();
      }

      function play() {
        if (isPlaying) return;
        isPlaying = true;
        playPauseBtn.textContent = "⏸";

        playInterval = setInterval(() => {
          if (currentIndex >= data.length) {
            pause();
            return;
          }
          stepForward();
        }, iterationSpeed); // velocidad replay
      }

      function pause() {
        isPlaying = false;
        playPauseBtn.textContent = "▶️";
        clearInterval(playInterval);
      }

      function togglePlayPause() {
        isPlaying ? pause() : play();
      }

      function startStepBack() {
        if (isSteppingBack) return;

        pause(); // ⛔ no permitir play + back
        isSteppingBack = true;

        backInterval = setInterval(() => {
          if (currentIndex <= 0) {
            stopStepBack();
            return;
          }
          stepBack();
        }, iterationSpeed); // velocidad
      }

      function stopStepBack() {
        isSteppingBack = false;
        clearInterval(backInterval);
      }

      function startStepForward() {
        if (isSteppingForward) return;

        stopStepBack(); // ⛔ no avanzar y retroceder a la vez
        pause(); // ⛔ no play automático

        isSteppingForward = true;

        forwardInterval = setInterval(() => {
          if (currentIndex >= data.length) {
            stopStepForward();
            return;
          }
          stepForward();
        }, iterationSpeed);
      }

      function stopStepForward() {
        isSteppingForward = false;
        clearInterval(forwardInterval);
      }

      /* =========================
     BUTTON BINDINGS
     ========================= */
      const stepBackBtn = document.getElementById("stepBack");
      const playPauseBtn = document.getElementById("playPause");
      const stepForwardBtn = document.getElementById("stepForward");

      stepBackBtn.addEventListener("click", stepBack);
      playPauseBtn.addEventListener("click", togglePlayPause);
      stepForwardBtn.addEventListener("click", stepForward);

      stepBackBtn.addEventListener("pointerdown", startStepBack);
      stepBackBtn.addEventListener("pointerup", stopStepBack);
      stepBackBtn.addEventListener("pointerleave", stopStepBack);

      stepForwardBtn.addEventListener("pointerdown", startStepForward);
      stepForwardBtn.addEventListener("pointerup", stopStepForward);
      stepForwardBtn.addEventListener("pointerleave", stopStepForward);

      const speedLabel = document.getElementById("speedLabel");
      const speedRange = document.getElementById("speedRange");

      speedRange.addEventListener("input", (e) => {
        iterationSpeed = Number(e.target.value);
        speedLabel.textContent = `${iterationSpeed} ms`;

        // si está reproduciendo, reiniciamos intervalos
        if (isPlaying) {
          pause();
          play();
        }

        if (isSteppingForward) {
          stopStepForward();
          startStepForward();
        }

        if (isSteppingBack) {
          stopStepBack();
          startStepBack();
        }
      });

      /* =========================
     RESIZE HANDLING
     ========================= */
      window.addEventListener("resize", () => {
        chart.applyOptions({
          width: container.clientWidth,
          height: container.clientHeight,
        });
      });

      const test = () => {
        iterationSpeed = 0;
        togglePlayPause();
      };

    
    </script>
  </body>
</html>
