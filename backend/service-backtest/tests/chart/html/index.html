<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lightweight Charts v4+ (ESM working)</title>
    <link rel="stylesheet" href="/html/styles.css" />
    <script type="module" src="/html/app.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="chart-container">
        <div id="chart"></div>
      </div>

      <div class="controls">
        <button id="addSymbol">Add BTCUSDT</button>
        <button id="addTimeframe">Add Timeframe 1h</button>
        <button id="stepBack" title="Step back">⏮</button>
        <button id="playPause" title="Play / Pause">▶️</button>
        <button id="stepForward" title="Step forward">⏭</button>

        <div class="speed-control">
          <input
            id="speedRange"
            type="range"
            min="1"
            max="1000"
            step="50"
            value="400"
          />
        </div>
        <span id="speedLabel">400 ms</span>
      </div>
    </div>
  </body>
</html>
