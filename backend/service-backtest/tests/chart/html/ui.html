<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Editor</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0c0d0f;
        --surface: #13151a;
        --panel: #1a1d24;
        --border: #2a2d38;
        --accent: #e8ff47;
        --accent2: #47c8ff;
        --muted: #3a3d4a;
        --label: #5a5f72;
        --gap: 6px;
        --radius: 6px;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        font-family: "JetBrains Mono", monospace;
        color: var(--label);
        overflow: hidden;
      }

      /* ── Top bar ───────────────────────────────────────────── */
      .topbar {
        height: 38px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 24px;
      }

      .topbar .logo {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 13px;
        color: var(--accent);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .topbar .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--muted);
      }

      .topbar .dot.active {
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }

      /* ── Main layout ───────────────────────────────────────── */
      .editor {
        display: grid;
        grid-template-rows: 1fr 220px;
        grid-template-columns: 1fr;
        gap: var(--gap);
        padding: var(--gap);
        height: calc(100vh - 38px);
      }

      /* ── Viewer row ────────────────────────────────────────── */
      .viewers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--gap);
        min-height: 0;
      }

      /* ── Shared panel style ────────────────────────────────── */
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        position: relative;
        overflow: hidden;
        transition: border-color 0.2s;
      }

      .panel:hover {
        border-color: var(--muted);
      }

      /* Corner markers */
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        border-color: var(--accent);
        border-style: solid;
        opacity: 0.4;
        z-index: 2;
      }

      .panel::before {
        top: 8px;
        left: 8px;
        border-width: 1px 0 0 1px;
      }

      .panel::after {
        bottom: 8px;
        right: 8px;
        border-width: 0 1px 1px 0;
      }

      /* Panel labels */
      .panel-label {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--label);
        z-index: 3;
        white-space: nowrap;
        pointer-events: none;
      }

      /* Source viewer accent */
      .viewer-source {
        --accent-local: var(--accent2);
      }

      .viewer-source::before,
      .viewer-source::after {
        border-color: var(--accent2);
      }

      /* Program viewer accent */
      .viewer-program {
        --accent-local: var(--accent);
      }

      /* Subtle scanline texture */
      .panel-inner-texture {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 3px,
          rgba(255, 255, 255, 0.012) 4px
        );
        pointer-events: none;
        z-index: 1;
      }

      /* Center reticle */
      .reticle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        z-index: 2;
        opacity: 0.15;
      }

      .reticle::before,
      .reticle::after {
        content: "";
        position: absolute;
        background: var(--accent);
      }

      .reticle::before {
        width: 1px;
        height: 100%;
        left: 50%;
      }

      .reticle::after {
        height: 1px;
        width: 100%;
        top: 50%;
      }

      .viewer-source .reticle::before,
      .viewer-source .reticle::after {
        background: var(--accent2);
      }

      /* ── Timeline ──────────────────────────────────────────── */
      .timeline {
        position: relative;
        overflow: hidden;
      }

      /* Tick marks along top edge */
      .timeline-ticks {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 20px;
        display: flex;
        align-items: flex-end;
        padding: 0 32px;
        gap: 0;
        z-index: 3;
        border-bottom: 1px solid var(--border);
      }

      .tick {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .tick::before {
        content: "";
        display: block;
        width: 1px;
        height: 6px;
        background: var(--muted);
      }

      .tick:nth-child(5n)::before {
        height: 10px;
        background: var(--label);
      }

      /* Playhead */
      .playhead {
        position: absolute;
        top: 0;
        left: 28%;
        width: 1px;
        height: 100%;
        background: var(--accent);
        z-index: 5;
        box-shadow:
          0 0 10px var(--accent),
          0 0 2px var(--accent);
      }

      .playhead::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 8px solid var(--accent);
      }

      /* Track lanes */
      .tracks {
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 4px 0;
      }

      .track-lane {
        flex: 1;
        display: flex;
        border-bottom: 1px solid var(--border);
      }

      .track-header {
        width: 30px;
        min-width: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid var(--border);
        font-size: 7px;
        letter-spacing: 0.1em;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: var(--muted);
        text-transform: uppercase;
      }

      .track-body {
        flex: 1;
        position: relative;
      }

      /* Subtle horizontal grid lines in track body */
      .track-body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent calc(10% - 1px),
          var(--border) calc(10% - 1px),
          var(--border) 10%
        );
        opacity: 0.25;
      }

      /* Timeline label */
      .timeline .panel-label {
        top: 6px;
      }

      /* Vignette on viewers */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.5) 100%
        );
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <span class="logo">Blacker</span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </header>

    <!-- Editor grid -->
    <main class="editor">
      <!-- Viewer row -->
      <section class="viewers">
        <div class="panel viewer-source">
          <div class="panel-inner-texture"></div>
          <div class="vignette"></div>
          <div class="reticle"></div>
          <span class="panel-label">Source Monitor</span>


          <div>pan</div>
        </div>

        <div class="panel viewer-program">
          <div class="panel-inner-texture"></div>
          <div class="vignette"></div>
          <div class="reticle"></div>
          <span class="panel-label">Program Monitor</span>
        </div>
      </section>
      <!-- Viewer row -->

      <!-- Timeline -->
      <div class="panel timeline">
        <span class="panel-label">Timeline</span>
        <!-- Track lanes -->
        <div class="tracks">
          <div class="track-lane">
            <div class="track-header">V2</div>
            <div class="track-body"></div>
          </div>
          <div class="track-lane">
            <div class="track-header">V1</div>
            <div class="track-body"></div>
          </div>
          <div class="track-lane">
            <div class="track-header">A1</div>
            <div class="track-body"></div>
          </div>
          <div class="track-lane">
            <div class="track-header">A2</div>
            <div class="track-body"></div>
          </div>
        </div>
        <!-- Track lanes -->
      </div>
      <!-- Timeline -->
    </main>
  </body>
</html>
