info:
  name: /ws
  type: websocket
  seq: 1

websocket:
  url: ws://localhost:3001/api/market/ws
  message:
    type: json
    data: |-
      {
        "action": "subscribe",
        "source": "binance",
        "symbol": "BTCUSDT",
        "timeframe": "1m"
      }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0
