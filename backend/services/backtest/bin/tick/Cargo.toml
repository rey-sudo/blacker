[package]
name = "tick"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
redis = { version = "1.2.3", features = ["tokio-comp"] }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
rust_decimal = "1.42.1"
