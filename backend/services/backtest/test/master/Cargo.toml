[package]
name = "master"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
bincode = { version = "2.0.1", features = ["serde"] }
crc32fast = "1.5.0"
cursor-db = "0.1.3"
futures = "0.3.32"
pulsar = "6.8.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version =  "1.23.5", features = ["v7"] }
