[package]
name = "service-ingest"
version = "0.1.1"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.36", features = ["ring"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"